<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white shadow px-6 py-4">
      <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-2">
        <h1 class="text-xl font-bold text-green-700">ポケモン同好会</h1>
        <nav class="flex flex-col md:flex-row gap-2 md:gap-6 text-sm">
          <a href="#" class="text-gray-700 hover:text-green-600">ホーム</a>
          <a href="#" class="text-gray-700 hover:text-green-600">活動内容</a>
          <a href="#" class="text-gray-700 hover:text-green-600">入会のお問い合わせはこちらから</a>
        </nav> 
      </div>

    <!-- ヘッダー -->
    <header>
      
    </header>

    <!-- メイン -->
    <main class="max-w-4xl mx-auto px-6 py-10">

      <!-- ヒーローエリア -->
      <section class="mb-10 text-center">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">みんなでポケモンを、やろう</h2>
        <p class="text-gray-600">私たちは日々進化するポケモンのゲームを遊びつくすグループです</p>
      </section>

      <!-- 活動内容カード -->
      <section class="mb-10">
        <h2 class="text-xl font-bold mb-4">活動内容</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🎮</p>
            <h3 class="font-bold">週に何回か集まってポケモンの対戦ゲームを心行くまで堪能します</h3>
            <p class="text-gray-500 text-sm mt-1">週に2回、金曜と日曜にオフィスに集まってポケモンをプレイします</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🔥</p>
            <h3 class="font-bold">対戦型</h3>
            <p class="text-gray-500 text-sm mt-1">自分のパーティを使ってポケモン対戦を楽しむことができます。シングル、ダブル、教育クエストの三種類があります。</p>
          </div>
          <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
            <p class="text-2xl mb-2">🌱</p>
            <h3 class="font-bold">厳選および育成型</h3>
            <p class="text-gray-500 text-sm mt-1">ここはポケモンの個体厳選および育成を行います。プレイヤー同士でポケモンの交換も行うことができます。</p>
          </div>
        </div>
      </section>

    </main>

    <!-- フッター -->
    <footer class="bg-gray-800 text-gray-400 text-sm text-center py-6">
      &copy; 2026
    </footer>
